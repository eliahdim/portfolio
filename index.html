  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Portfolio of Eliah Dimmed, a TE4 graduate in Skåne focused on IT support, onsite technical service, networks, troubleshooting, and practical problem solving."
    />
    <meta name="author" content="Eliah Dimmed" />
    <meta name="theme-color" content="#0d1412" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eliah Dimmed | Junior IT Support & IT Technician" />

      property="og:description"
      content="Hands-on IT experience, support skills, selected projects, and contact details for Eliah Dimmed."
    />
    <meta property="og:image" content="images/eliahdimmed.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="images/eliahdimmed.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <script>
      (() => {
        const storageKey = 'eliah-portfolio-language';
        let language = 'en';

        try {
          const storedLanguage = window.localStorage.getItem(storageKey);
          if (storedLanguage === 'sv' || storedLanguage === 'en') {
            language = storedLanguage;
          } else {
            const browserLanguage = navigator.languages?.[0] || navigator.language || 'en';
            language = browserLanguage.toLowerCase().startsWith('sv') ? 'sv' : 'en';
          }
        } catch {
          language = (navigator.language || 'en').toLowerCase().startsWith('sv') ? 'sv' : 'en';
        }

        document.documentElement.lang = language;
        document.documentElement.dataset.language = language;
      })();
    </script>
    <div id="root">
      <main class="app-error">
        <h1>Loading Eliah Dimmed portfolio...</h1>
        <p>If this message stays visible, the React bundle did not load.</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
